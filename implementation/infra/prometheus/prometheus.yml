global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Kafka broker JMX metrics via jmx-kafka sidecar
  - job_name: kafka-jmx
    static_configs:
      - targets: ["jmx-kafka:5556"]
        labels:
          broker: kafka-1

  # Kafka topic/consumer-lag metrics
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Spark master metrics endpoint (enabled via metrics.properties in image)
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: ["spark-master:8080"]

  # Spark worker metrics endpoints
  - job_name: spark-worker-1
    metrics_path: /metrics/worker/prometheus/
    static_configs:
      - targets: ["spark-worker-1:8081"]

  - job_name: spark-worker-2
    metrics_path: /metrics/worker/prometheus/
    static_configs:
      - targets: ["spark-worker-2:8081"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
