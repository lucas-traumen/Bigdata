# Big Data IoT platform - Phase 1 core pipeline.
#
# Architecture: Sensor Simulator -> Kafka (KRaft) -> Spark Structured Streaming
#   -> Delta Lake on HDFS (Bronze -> Silver -> Gold), with Prometheus/Grafana.
#
# Memory budget (see implementation/README.md): total mem_limit ~13.3g <= 13.5g.
#
# Usage:
#   cd implementation/infra
#   docker compose build
#   docker compose up -d
#   ../scripts/init-cluster.sh

name: bigdata

x-spark-common: &spark-common
  image: bigdata/spark:4.2.0-delta-4.4.0
  build:
    context: ../spark
  networks: [bigdata]

services:
  # ---------------------------------------------------------------- HDFS ----
  hdfs-namenode:
    image: apache/hadoop:3.5.0
    container_name: hdfs-namenode
    user: root                     # named volumes are root-owned; keep it simple
    command: ["hdfs", "namenode"]
    env_file: hadoop/common.env
    environment:
      ENSURE_NAMENODE_DIR: /opt/hadoop/data/name
      ENSURE_NAMENODE_CLUSTERID: bigdata-demo-cluster
    volumes:
      - hdfs_name:/opt/hadoop/data
    ports:
      - "9870:9870"                # NameNode Web UI
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [bigdata]

  hdfs-datanode-1:
    image: apache/hadoop:3.5.0
    container_name: hdfs-datanode-1
    user: root
    command: ["hdfs", "datanode"]
    env_file: hadoop/common.env
    volumes:
      - hdfs_data_1:/opt/hadoop/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    mem_limit: 896m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [bigdata]

  hdfs-datanode-2:
    image: apache/hadoop:3.5.0
    container_name: hdfs-datanode-2
    user: root
    command: ["hdfs", "datanode"]
    env_file: hadoop/common.env
    volumes:
      - hdfs_data_2:/opt/hadoop/data
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    mem_limit: 896m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [bigdata]

  # --------------------------------------------------------------- Kafka ----
  kafka-1:
    image: apache/kafka:4.3.1
    container_name: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft combined mode
      # Valid 22-char base64url UUID (kafka-storage format requirement).
      CLUSTER_ID: y_0fxZtCA_pAl8Q88rcy1w
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1       # single broker
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx1024m -Xms512m"
      JMX_PORT: 5555
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      # JMX_PORT must be EMPTY here: the CLI tool would otherwise start its own
      # JMX agent and fail to bind (the broker already owns 5555).
      test: ["CMD-SHELL", "JMX_PORT= /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 25s
    networks: [bigdata]

  # JMX exporter sidecar: scrapes broker JMX (kafka-1:5555) on :5556
  jmx-kafka:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-kafka
    command: ["5556", "/opt/jmx/kafka-config.yml"]
    volumes:
      - ./jmx/kafka-config.yml:/opt/jmx/kafka-config.yml:ro
    depends_on:
      kafka-1:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks: [bigdata]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka-1:9092", "--web.listen-address=:9308"]
    depends_on:
      kafka-1:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    networks: [bigdata]

  # --------------------------------------------------------------- Spark ----
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"                # Spark master Web UI
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      hdfs-namenode:
        condition: service_healthy

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_MEMORY: 1792m
      SPARK_WORKER_CORES: 4
    ports:
      - "8081:8081"                # worker Web UI
    mem_limit: 2176m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      spark-master:
        condition: service_healthy

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_WORKER_MEMORY: 1792m
      SPARK_WORKER_CORES: 4
    ports:
      - "8082:8081"                # worker Web UI
    mem_limit: 2176m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      spark-master:
        condition: service_healthy

  # --------------------------------------------------- Spark job runners ----
  # Streaming jobs run in their own containers (client mode): the driver JVM
  # stays out of spark-master, and each job restarts independently.

  spark-bronze:
    <<: *spark-common
    container_name: spark-bronze
    command: ["/opt/spark/run/run-bronze.sh"]
    mem_limit: 700m
    restart: unless-stopped
    depends_on:
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      hdfs-namenode:
        condition: service_healthy

  spark-silver:
    <<: *spark-common
    container_name: spark-silver
    command: ["/opt/spark/run/run-silver.sh"]   # loops every SILVER_INTERVAL (30s)
    restart: unless-stopped
    mem_limit: 700m
    depends_on:
      spark-worker-1:
        condition: service_healthy
      hdfs-namenode:
        condition: service_healthy

  spark-gold:
    <<: *spark-common
    container_name: spark-gold
    command: ["/opt/spark/run/run-gold.sh"]
    mem_limit: 700m
    restart: unless-stopped
    depends_on:
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      hdfs-namenode:
        condition: service_healthy

  # ------------------------------------------------------------ Simulator ----
  sensor-simulator:
    image: bigdata/sensor-simulator:latest
    build:
      context: ../simulator
    container_name: sensor-simulator
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092
      TOPIC: sensor.raw
      RATE: "200"        # events/second
      DURATION: "0"      # 0 = run forever (service mode)
      EVENTS: "0"        # 0 = unlimited
      FAULT_INJECT: "0"  # 1 = enable fault profile (2% dup, 1% missing, ...)
    depends_on:
      kafka-1:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    networks: [bigdata]

  # ---------------------------------------------------------- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [bigdata]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bigdata
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [bigdata]

networks:
  bigdata:
    driver: bridge

volumes:
  hdfs_name:
  hdfs_data_1:
  hdfs_data_2:
  kafka_data:
