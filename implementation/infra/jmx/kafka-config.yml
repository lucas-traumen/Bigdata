# JMX exporter standalone config: scrape Kafka broker JMX at kafka-1:5555
# and expose Prometheus metrics on :5556 (sidecar jmx-kafka).
hostPort: kafka-1:5555
rules:
  # Broker-level topic/partition/log metrics
  - pattern: kafka.server<type=(\w+), name=(\w+), topic=(\w+)><>(\w+)
    name: kafka_server_$1_$2_$4
    labels:
      topic: "$3"
    type: GAUGE
  - pattern: kafka.server<type=(\w+), name=(\w+)><>(\w+)
    name: kafka_server_$1_$2_$3
    type: GAUGE
  # Network request metrics
  - pattern: kafka.network<type=(\w+), name=(\w+), request=(\w+)><>(\w+)
    name: kafka_network_$1_$2_$4
    labels:
      request: "$3"
    type: GAUGE
  # Log metrics
  - pattern: kafka.log<type=(\w+), name=(\w+), topic=(\w+), partition=(\w+)><>(\w+)
    name: kafka_log_$1_$2_$5
    labels:
      topic: "$3"
      partition: "$4"
    type: GAUGE
  # JVM (broker heap usage, GC) - useful for the mem_limit budget check
  - pattern: java.lang<type=Memory><HeapMemoryUsage>(\w+)
    name: jvm_heap_memory_usage_$1
    type: GAUGE
  - pattern: 'java.lang<type=GarbageCollector, name=(\w+)><>CollectionCount'
    name: jvm_gc_collection_count
    labels:
      gc: "$1"
    type: COUNTER
