# Mosquitto 2.x broker configuration for the demo stack.
# Mounted read-only at /mosquitto/config/mosquitto.conf.

listener 1883 0.0.0.0
allow_anonymous true

# Demo-only: no TLS, no authentication, no ACLs (out of scope; see README).
# Persistence is disabled: queued QoS1 messages for an offline bridge are lost
# on broker restart. The recovery story is documented in docs/ARCHITECTURE.md.
persistence false

# Backpressure: messages queued for a persistent (clean_session=false) client.
# When the limit is hit the broker drops the newest message being enqueued.
max_queued_messages 5000
# 200 is a load-test setting under evaluation; record before/after run metadata.
max_inflight_messages 200

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
