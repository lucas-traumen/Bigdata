# Static dashboard + API reverse proxy.
# Docker's embedded DNS (127.0.0.11) is used so a backend restart with a new
# IP is picked up without rebuilding the container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # API endpoints forwarded to the FastAPI backend
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 3s;
    }

    # health endpoint forwarded as-is (used by scripts and humans)
    location /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }
}
